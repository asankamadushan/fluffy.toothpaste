# Lint + tests on pull requests (and pushes to the default branch).
# Ref: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Python version: default in .github/actions/setup-uv-with-python/action.yml
      - name: Install uv and Python
        uses: ./.github/actions/setup-uv-with-python
        with:
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml

      - name: Sync environment from lockfile
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Pytest
        id: pytest
        if: success()
        run: |
          mkdir -p test-results
          uv run pytest --junitxml=test-results/junit.xml --tb=short

      - name: Upload test results (JUnit XML)
        if: ${{ always() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Publish test results to checks
        if: ${{ always() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        with:
          files: test-results/junit.xml
          check_name: Test results
          comment_mode: off
