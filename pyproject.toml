[project]
name = "fluffy.toothpaste"
version = "0.1.0"
description = "Multi-monitor desktop background manager"
requires-python = ">=3.14"
dependencies = [
    "Pillow==12.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.10",
    "pytest==9.0.0",
    "pytest-mock==3.15.0",
    # Python 3.14 is supported from PyInstaller 6.15 onward.
    "pyinstaller==6.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = {"src" = ""}
include = ["src/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
