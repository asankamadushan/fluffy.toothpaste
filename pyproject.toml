[project]
name = "desktop-bg-app"
version = "0.1.0"
description = "Multi-monitor desktop background manager"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = {"src" = ""}
include = ["src/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
